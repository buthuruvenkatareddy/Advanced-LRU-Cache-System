services:
  # Backend API Service
  - type: web
    name: lru-cache-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.fastapi_app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PORT
        value: 10000
    healthCheckPath: /health

  # Frontend Service
  - type: web
    name: lru-cache-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: NODE_VERSION
        value: 18.17.0
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
